version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: leadflow-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: leadflow_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leadflow_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: leadflow-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # Perfil "app": `docker compose --profile app up --build`
  # (sem o perfil, `docker compose up -d` sobe só PostgreSQL e Redis, como antes)
  migrate:
    profiles: ["app"]
    build:
      context: .
      target: build
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/leadflow_db?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["app"]
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/leadflow_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started


volumes:
  postgres_data:
  redis_data:
